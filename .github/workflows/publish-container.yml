name: CI

# Build the docket-server container, push to GHCR, sign with cosign keyless,
# then dispatch a manifest update to the deployment repository.
# Secrets used: CD_TOKEN, CD_URI, CD_ORG, CD_REPO

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/docket-server

jobs:
  test:
    runs-on: ubuntu-latest
    # Every test makes a database of its own on this server.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docket-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docket-web/package-lock.json

      - run: npm ci

      - name: Check types
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  build:
    if: github.event_name != 'pull_request'
    needs: [test, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.3.0
        with:
          cosign-release: 'v2.2.2'

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@79abd3f86f79a9d68a23c75a09a9a85889262adf

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${{ steps.build-and-push.outputs.digest }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch manifest update
        env:
          CD_URI: ${{ secrets.CD_URI }}
        run: |
          if [ -z "$CD_URI" ]; then
            echo "CD_URI is not set; skipping the manifest dispatch"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.CD_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "$CD_URI" \
            -d '{
              "event_type": "update-manifest",
              "client_payload": {
                "digest":    "${{ needs.build.outputs.digest }}",
                "repo_name": "${{ secrets.CD_REPO }}",
                "repo_org":  "${{ secrets.CD_ORG }}",
                "branch":    "prod"
              }
            }'
