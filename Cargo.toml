[workspace]
members = ["docket-core", "docket-server"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
axum = "0.8.9"
crudcrate = "0.15.0"
rand = "0.9"
regex = "1.13"
sea-orm = { version = "2.0.0", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5.2", features = ["util"] }
utoipa = "5.5.0"
utoipa-axum = "0.2.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
