[workspace]
members = ["docket", "docket-client", "docket-core", "docket-dump", "docket-migration", "docket-server", "docket-tui"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.28"
crudcrate = "0.15.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.9"
ratatui = "0.29"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sea-orm = { version = "2.0.0", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json"] }
sea-orm-migration = { version = "2.0.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5.2", features = ["util"] }
utoipa = "5.5.0"
utoipa-axum = "0.2.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
