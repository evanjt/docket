[package]
name = "docket"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

docket-client = { path = "../docket-client" }
docket-core = { path = "../docket-core" }
docket-tui = { path = "../docket-tui" }

[dev-dependencies]
axum = { workspace = true }
docket-migration = { path = "../docket-migration", features = ["scratch"] }
docket-server = { path = "../docket-server" }
tempfile = "3"
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
